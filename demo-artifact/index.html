<style>
/* Layout: phone-first app shell — sticky top bar, one scrolling column (max 760px), fixed bottom tab bar; sheets slide up for forms. */
:root {
  --bg: #f7f6f3; --surface: #ffffff; --sunk: #efede8; --line: #e2dfd7; --line-strong: #cfcbc0;
  --fg: #1c2127; --muted: #59626d; --ink: #1c2127; --on-ink: #f7f6f3;
  --safety: #f26b1d; --safety-strong: #d65611; --safety-soft: #fff1e6; --on-safety: #ffffff;
  --blue: #2c5d8f; --blue-soft: #e8f0f8; --green: #2f7d4f; --green-soft: #e7f3ec; --red: #b83a2e; --red-soft: #fbeceb; --amber: #8a6600; --amber-soft: #fbf3dc; --violet: #6a3fb0; --violet-soft: #f0eafa;
  --shadow: 0 1px 2px rgba(20,24,28,.06), 0 1px 1px rgba(20,24,28,.04);
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121519; --surface: #1b2026; --sunk: #232930; --line: #2c333b; --line-strong: #3b434d;
  --fg: #eceae4; --muted: #a3a8ae; --ink: #eceae4; --on-ink: #121519;
  --safety: #ff8a3d; --safety-strong: #ff9d5c; --safety-soft: #33231a; --on-safety: #1b1209;
  --blue: #8fb8e3; --blue-soft: #1d2a38; --green: #7cc79a; --green-soft: #1a2c22; --red: #f0958b; --red-soft: #3a1f1c; --amber: #e7c25a; --amber-soft: #352c14; --violet: #c2a6f0; --violet-soft: #2a2238;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1b2026; --sunk: #232930; --line: #2c333b; --line-strong: #3b434d;
  --fg: #eceae4; --muted: #a3a8ae; --ink: #eceae4; --on-ink: #121519;
  --safety: #ff8a3d; --safety-strong: #ff9d5c; --safety-soft: #33231a; --on-safety: #1b1209;
  --blue: #8fb8e3; --blue-soft: #1d2a38; --green: #7cc79a; --green-soft: #1a2c22; --red: #f0958b; --red-soft: #3a1f1c; --amber: #e7c25a; --amber-soft: #352c14; --violet: #c2a6f0; --violet-soft: #2a2238;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.col { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.grow { flex: 1; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .col { display: flex; align-items: center; gap: 10px; min-height: 56px; }
.logo { display: flex; align-items: center; gap: 8px; font: 800 18px/1 var(--display); letter-spacing: -0.01em; background: none; border: 0; padding: 0; cursor: pointer; }
.logo b { color: var(--safety); font-weight: 800; }
.mode { margin-left: auto; display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; }
.mode button { border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-size: 13px; font-weight: 650; color: var(--muted); cursor: pointer; min-height: 34px; }
.mode button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* Bottom nav */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .inner { max-width: 760px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 8px 2px 9px; font-size: 11px; font-weight: 650; color: var(--muted); cursor: pointer; min-height: 56px; }
.tabs button[aria-current="page"] { color: var(--safety); }
.tabs svg { width: 22px; height: 22px; }
main.screen { padding-block: 16px calc(88px + env(safe-area-inset-bottom, 0px)); }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font-weight: 650; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--safety); color: var(--on-safety); }
.btn.primary:hover:not(:disabled) { background: var(--safety-strong); }
.btn.dark { background: var(--ink); color: var(--on-ink); }
.btn.outline { background: var(--surface); border-color: var(--line-strong); }
.btn.ghost { background: none; color: var(--muted); }
.btn.danger { background: none; color: var(--red); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn.lg { min-height: 50px; font-size: 15px; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--safety) 60%, transparent); outline-offset: 2px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 650; }
.field label span { font-weight: 400; color: var(--muted); }
.input { width: 100%; min-height: 44px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 9px 12px; font-size: 16px; }
textarea.input { min-height: 88px; resize: vertical; }
.input:focus { border-color: var(--safety); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--safety) 22%, transparent); }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.card.pad { padding: 16px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.card-h h3 { font-size: 16px; font-weight: 750; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; }
.item:hover { background: var(--sunk); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 650; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.t-orange { background: var(--safety-soft); color: var(--safety-strong); }
.t-blue { background: var(--blue-soft); color: var(--blue); }
.t-green { background: var(--green-soft); color: var(--green); }
.t-red { background: var(--red-soft); color: var(--red); }
.t-yellow { background: var(--amber-soft); color: var(--amber); }
.t-purple { background: var(--violet-soft); color: var(--violet); }
.avatar { flex: none; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: #1c2127; color: #ff8a3d; font: 800 14px/1 var(--display); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.round { border-radius: 50%; }
.avatar.lg { width: 76px; height: 76px; font-size: 24px; border-radius: 16px; border: 4px solid var(--surface); }
.pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 4px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 650; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.seg { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.seg button { flex: none; border: 0; background: none; padding: 10px 10px 9px; border-bottom: 2px solid transparent; font-weight: 650; font-size: 14px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--fg); border-color: var(--safety); }
.seg .c { margin-left: 4px; font-size: 11px; background: var(--sunk); border-radius: 5px; padding: 1px 5px; }
.stat { padding: 14px; display: grid; gap: 2px; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.stat.hot { border-color: var(--safety); background: var(--safety-soft); }
.stat b { font: 800 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.band { background: #1c2127; color: #efede8; border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.band .big { font: 800 34px/1 var(--display); color: #ff8a3d; font-variant-numeric: tabular-nums; }
.band .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.band .trio b { display: block; font: 750 20px/1.2 var(--display); }
.band .trio span { font-size: 11px; color: #a9a498; }
.empty { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 28px 18px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.empty h3 { font-size: 16px; }
.notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; background: var(--amber-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); }
.ok { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.back { border: 0; background: none; color: var(--muted); font-weight: 650; font-size: 14px; padding: 4px 0; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; min-height: 36px; }
.h1 { font: 800 26px/1.15 var(--display); }

/* Post + media */
.post { overflow: hidden; }
.post-head { display: flex; gap: 10px; align-items: center; padding: 10px 12px; }
.media { position: relative; background: var(--sunk); aspect-ratio: 4 / 3; overflow: hidden; }
.media.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; aspect-ratio: 8 / 5; }
.media img, .media svg { display: block; width: 100%; height: 100%; object-fit: cover; }
.media .lbl { position: absolute; top: 8px; left: 8px; background: rgba(13,16,19,.8); color: #fff; font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; }
.media .cell { position: relative; overflow: hidden; }
.acts { display: flex; align-items: center; padding: 4px 6px 0; }
.icon-btn { border: 0; background: none; min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 10px; font-weight: 650; font-size: 14px; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--sunk); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.on { color: var(--safety); }
.quote-strip { margin: 10px 12px 12px; display: flex; justify-content: center; min-height: 40px; align-items: center; border-radius: 10px; background: var(--safety-soft); color: var(--safety-strong); font-weight: 700; font-size: 14px; border: 0; cursor: pointer; width: calc(100% - 24px); }

/* Profile */
.cover { height: 150px; background: #1c2127; position: relative; overflow: hidden; margin-inline: -16px; }
.cover svg, .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portfolio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; border-radius: 12px; overflow: hidden; }
.portfolio button { padding: 0; border: 0; aspect-ratio: 1; overflow: hidden; cursor: pointer; background: var(--sunk); }
.portfolio svg, .portfolio img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sticky-cta { position: fixed; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); z-index: 35; background: color-mix(in srgb, var(--surface) 96%, transparent); border-top: 1px solid var(--line); padding-block: 8px; }
.sticky-cta .col { display: flex; gap: 8px; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(13,16,19,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 0 0 calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.sheet-h { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); z-index: 1; }
.sheet-h h2 { font-size: 18px; }
.sheet-b { padding: 16px; display: grid; gap: 14px; }

/* Tasks */
.check { flex: none; width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: #fff; }
.check.done { background: var(--green); border-color: var(--green); }
.strike { text-decoration: line-through; color: var(--muted); }
.progress { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--safety); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: #1c2127; color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
.hero { background: #1c2127; color: #efede8; border-radius: 16px; padding: 20px; display: grid; gap: 10px; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 24px 24px; }
.hero h1 { font-size: 28px; font-weight: 850; font-stretch: 92%; line-height: 1.05; }
.hero em { font-style: normal; color: #ff8a3d; }
.skeleton { background: var(--sunk); border-radius: 14px; height: 120px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<script>
const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;
const html = htm.bind(React.createElement);

/* ───────────────────────── Reference data ───────────────────────── */
const SERVICES = [
  ["general-contractor","General Contractor","General Contractors"],["electrician","Electrician","Electricians"],["plumber","Plumber","Plumbers"],
  ["mason","Mason","Masons"],["tiler","Tiler","Tilers"],["carpenter","Carpenter","Carpenters"],["painter","Painter","Painters"],
  ["roofer","Roofer","Roofers"],["landscaper","Landscaper","Landscapers"],["hvac","HVAC Technician","HVAC Professionals"],
  ["renovation","Home Renovation","Home Renovation Contractors"],["welder","Welder / Steel Work","Welders"],
].map(([id, name, plural]) => ({ id, name, plural }));
const svc = (id) => SERVICES.find((s) => s.id === id);
const PARISHES = ["Kingston","St Andrew","St Catherine","Clarendon","Manchester","St Elizabeth","Westmoreland","Hanover","St James","Trelawny","St Ann","St Mary","Portland","St Thomas"];
const LEAD_ST = [["new","New","t-orange"],["contacted","Contacted","t-blue"],["qualified","Qualified","t-purple"],["quote_sent","Quote sent","t-yellow"],["negotiation","Negotiation","t-yellow"],["won","Won","t-green"],["lost","Lost","t-red"]];
const OPEN_LEAD = ["new","contacted","qualified","quote_sent","negotiation"];
const PROJ_ST = [["planning","Planning",""],["upcoming","Upcoming","t-blue"],["in_progress","In progress","t-orange"],["on_hold","On hold","t-yellow"],["completed","Completed","t-green"],["cancelled","Cancelled","t-red"]];
const ACTIVE_PROJ = ["planning","upcoming","in_progress","on_hold"];
const SOURCES = [["buildflow","BuildFlow"],["referral","Referral"],["phone","Phone"],["social_media","Social media"],["website","Website"],["other","Other"]];
const POST_TYPES = [["completed_project","Completed project"],["before_after","Before / after"],["work_in_progress","Work in progress"],["service_showcase","Service showcase"],["business_update","Business update"]];
const PRIORITY = [["low","Low",""],["medium","Medium","t-yellow"],["high","High","t-red"]];
const SCENES = [["house","New build"],["roof","Roof"],["wall","Block wall"],["tile-before","Old tiles"],["tile-after","New tiles"],["panel","Electrical panel"],["driveway","Driveway"],["kitchen","Kitchen"]];
const label = (list, v) => (list.find((x) => x[0] === v) || [v, v, ""]);
const money = (n) => (n == null || n === "" || isNaN(n)) ? "—" : "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const compact = (n) => "$" + new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(n || 0);
const ago = (t) => { const s = (Date.now() - t) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.round(s/60)+"m ago"; if (s < 86400) return Math.round(s/3600)+"h ago"; if (s < 604800) return Math.round(s/86400)+"d ago"; return new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric"}); };
const day = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—";
const initials = (n) => (n || "?").replace(/\(.*?\)/g, "").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const slugify = (s) => s.toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "contractor";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0, 10);

const Ctx = createContext(null);

function useQuery(db, build, deps) {
  const [rows, setRows] = useState(null);
  useEffect(() => {
    if (!db) return;
    const q = build(db);
    if (!q) { setRows([]); return; }
    const off = q.onSnapshot((s) => setRows(s.docs.map((d) => ({ id: d.id, ...d.data() }))), () => setRows((r) => r || []));
    return off;
  }, [db, ...deps]);
  return rows;
}
function useDoc(db, path) {
  const [doc, setDoc] = useState(undefined);
  useEffect(() => {
    if (!db || !path) return;
    return db.doc(path).onSnapshot((s) => setDoc(s.exists ? { id: s.id, ...s.data() } : null), () => setDoc(null));
  }, [db, path]);
  return doc;
}

function parseSearch(q) {
  let rest = " " + q.toLowerCase().replace(/[^a-z0-9 ]/g, " ") + " ";
  let parish = null, service = null;
  for (const p of [...PARISHES].sort((a, b) => b.length - a.length)) { const k = " " + p.toLowerCase() + " "; if (rest.includes(k)) { parish = p; rest = rest.replace(k, " "); break; } }
  const keys = SERVICES.flatMap((s) => [s.plural, s.name, s.name.split(" ")[0] + "s", s.name.split(" ")[0]].map((k) => [s, " " + k.toLowerCase() + " "])).sort((a, b) => b[1].length - a[1].length);
  for (const [s, k] of keys) if (k.length > 4 && rest.includes(k)) { service = s.id; rest = rest.replace(k, " "); break; }
  return { parish, service, name: rest.replace(/\b(in|near|contractors?|the)\b/g, " ").replace(/\s+/g, " ").trim() };
}

function Explore({ focus }) {
  const { posts, businesses, go } = useApp();
  const [q, setQ] = useState("");
  const [service, setService] = useState("");
  const [parish, setParish] = useState("");
  const [tab, setTab] = useState(focus ? "contractors" : "work");
  const parsed = useMemo(() => parseSearch(q), [q]);
  const S = service || parsed.service, Pa = parish || parsed.parish, name = parsed.name;
  const visibleBiz = businesses.filter((b) => b.public !== false
    && (!S || (b.services || []).includes(S)) && (!Pa || b.parish === Pa)
    && (!name || [b.name, b.tagline, b.city, b.area].some((v) => (v || "").toLowerCase().includes(name))));
  const ids = new Set(visibleBiz.map((b) => b.id));
  const feed = posts.filter((p) => ids.has(p.businessId) && (!S || p.service === S || (businesses.find((b) => b.id === p.businessId)?.services || []).includes(S)));
  const heading = S || Pa ? `${S ? svc(S).plural : "Contractors"}${Pa ? " in " + Pa : ""}` : "Explore";
  return html`<div class="stack">
    <div><h1 class="h1">${heading}</h1><p class="muted small">Find contractors through the work they've done.</p></div>
    <div class="row" style=${{ position: "relative" }}>
      <span style=${{ position: "absolute", left: 12, color: "var(--muted)", display: "flex" }}><${Icon} n="search" /></span>
      <input class="input" style=${{ paddingLeft: 40 }} id="search" type="search" placeholder='Try "electricians in Kingston"' value=${q} autoFocus=${!!focus} onInput=${(e) => setQ(e.target.value)} aria-label="Search contractors, trades or places" />
    </div>
    <div class="grid2">
      <${Select} id="svc" value=${service} onChange=${setService} placeholder="All services" options=${SERVICES.map((s) => [s.id, s.plural])} />
      <${Select} id="parish" value=${parish} onChange=${setParish} placeholder="All parishes" options=${PARISHES.map((p) => [p, p])} />
    </div>
    <div class="pills">${SERVICES.slice(0, 8).map((s) => html`<button key=${s.id} class="pill" aria-pressed=${S === s.id} onClick=${() => setService(service === s.id ? "" : s.id)}>${s.plural}</button>`)}</div>
    <div class="seg"><button aria-pressed=${tab === "work"} onClick=${() => setTab("work")}>Work</button><button aria-pressed=${tab === "contractors"} onClick=${() => setTab("contractors")}>Contractors <span class="c">${visibleBiz.length}</span></button></div>
    ${tab === "work"
      ? (feed.length ? feed.map((p) => html`<${PostCard} key=${p.id} p=${p} />`) : html`<${Empty} icon="compass" title="No work posted here yet" text="Try another trade or parish, or browse contractors." />`)
      : (visibleBiz.length ? visibleBiz.map((b) => html`<${BizCard} key=${b.id} b=${b} />`) : html`<${Empty} icon="search" title="No contractors found" text="Try a broader search, like just the trade or just the parish." />`)}
  </div>`;
}

function QuoteForm({ b, kind, onDone }) {
  const { act, meName } = useApp();
  const [f, setF] = useState({ name: meName || "", phone: "", email: "", service: b.primary || "", location: "", description: "", budget: "", timeline: "" });
  const [err, setErr] = useState("");
  const [sent, setSent] = useState(false);
  const [busy, setBusy] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  if (sent) return html`<div class="stack" style=${{ textAlign: "center", justifyItems: "center", padding: "12px 0" }}><span style=${{ color: "var(--green)" }}><${Icon} n="check" size=${44} /></span><h3>${kind === "quote" ? "Quote request sent" : "Message sent"}</h3><p class="muted">${b.name} sees it right away as a new lead. Switch to <b>Contractor</b> mode as ${b.name} to see it arrive.</p><button class="btn outline" onClick=${onDone}>Done</button></div>`;
  async function submit(e) {
    e.preventDefault();
    if (!f.name.trim() || !f.description.trim()) return setErr("Add your name and a short description of the job.");
    if (!f.phone.trim() && !f.email.trim()) return setErr("Add a phone number or email so they can reach you.");
    setBusy(true); setErr("");
    const ok = await act.submitQuote(b, { ...f, kind });
    setBusy(false);
    if (ok) setSent(true); else setErr("Couldn't send. You may have view-only access to this demo.");
  }
  return html`<form class="stack" onSubmit=${submit} noValidate>
    ${err && html`<div class="notice" role="alert">${err}</div>`}
    <${Field} label="Your name" id="q-name"><input id="q-name" class="input" value=${f.name} onInput=${set("name")} autocomplete="name" /><//>
    <div class="grid2">
      <${Field} label="Phone" id="q-phone"><input id="q-phone" class="input" type="tel" value=${f.phone} onInput=${set("phone")} /><//>
      <${Field} label="Email" id="q-email"><input id="q-email" class="input" type="email" value=${f.email} onInput=${set("email")} /><//>
    </div>
    ${kind === "quote" && html`<${Field} label="Service needed" id="q-svc" opt><${Select} id="q-svc" value=${f.service} onChange=${(v) => setF({ ...f, service: v })} placeholder="Choose a service" options=${(b.services || []).map((s) => [s, (svc(s) || {}).name || s])} /><//>
    <${Field} label="Project location" id="q-loc" opt><input id="q-loc" class="input" placeholder="e.g. Liguanea, St Andrew" value=${f.location} onInput=${set("location")} /><//>`}
    <${Field} label=${kind === "quote" ? "Describe the job" : "Message"} id="q-desc"><textarea id="q-desc" class="input" value=${f.description} onInput=${set("description")} placeholder=${kind === "quote" ? "What needs doing, rough size, anything special…" : "How can they help?"}></textarea><//>
    ${kind === "quote" && html`<div class="grid2">
      <${Field} label="Budget" id="q-b" opt><${Select} id="q-b" value=${f.budget} onChange=${(v) => setF({ ...f, budget: v })} placeholder="Not sure yet" options=${["Under 250k","250k – 500k","500k – 1M","1M – 5M","5M+"].map((v) => [v, v])} /><//>
      <${Field} label="Timeline" id="q-t" opt><${Select} id="q-t" value=${f.timeline} onChange=${(v) => setF({ ...f, timeline: v })} placeholder="Flexible" options=${["As soon as possible","Within 1 month","1 – 3 months","3+ months"].map((v) => [v, v])} /><//>
    </div>`}
    <button class="btn primary lg block" disabled=${busy}>${busy ? "Sending…" : kind === "quote" ? "Request a quote" : "Send message"}</button>
    <p class="tiny muted" style=${{ textAlign: "center" }}>Your details go only to ${b.name}.</p>
  </form>`;
}

function PostDetail({ id }) {
  const { posts, db, me, act, profiles, go, actingAs, mode } = useApp();

  const comments = useQuery(db, (d) => d.collection("comments").where("postId", "==", id), [id]) || [];
  const [body, setBody] = useState("");
  useEffect(() => { if (p) act.trackView(p.businessId, p.id); }, [p && p.id]);
  if (!p) return html`<${Empty} title="Post not found" />`;
  const sorted = [...comments].sort((a, b) => a.createdAt - b.createdAt);
  const isOwner = mode === "contractor" && actingAs === p.businessId;
  return html`<div class="stack">
    <${Back} to=${{ name: "explore" }}>Explore<//>
    <${PostCard} p=${p} />
    <section class="stack" style=${{ gap: 10 }}>

        ${pr.avatarUrl ? html`<img class="avatar round" style=${{ width: 32, height: 32 }} src=${pr.avatarUrl} alt="" />` : html`<span class="avatar round" style=${{ width: 32, height: 32, fontSize: 11 }}>${initials(pr.name)}</span>`}
        <div class="grow"><p class="small"><b>${pr.name || "BuildFlow user"}</b> <span class="tiny muted">${ago(c.createdAt)}</span></p><p class="small" style=${{ whiteSpace: "pre-line", overflowWrap: "anywhere" }}>${c.body}</p>
        ${(c.authorId === me || isOwner) && html`<button class="btn danger sm" style=${{ paddingInline: 0 }} onClick=${() => act.deleteComment(p, c)}>Delete</button>`}</div></div>`; })}
      <form class="row" onSubmit=${async (e) => { e.preventDefault(); if (body.trim() && await act.addComment(p, body.trim())) setBody(""); }}>

    ${mine.length > 0 && html`<div class="card list"><div class="card-h"><h3>Your businesses</h3></div>${mine.map((b) => html`<button key=${b.id} class="item" onClick=${() => { setActingAs(b.id); go({ name: "dash" }); }}><${Avatar} b=${b} /><span class="grow"><b>${b.name}</b><br/><span class="small muted">${(svc(b.primary) || {}).name}</span></span></button>`)}</div>`}

    ${creating ? html`<form class="card pad stack" onSubmit=${create} noValidate>
        <h3 style=${{ fontSize: 17 }}>Set up your business</h3>
        ${err && html`<div class="notice" role="alert">${err}</div>`}

        <div class="grid2">
          <${Field} label="Main trade" id="nb-svc"><${Select} id="nb-svc" value=${f.primary} onChange=${(v) => setF({ ...f, primary: v })} placeholder="Choose…" options=${SERVICES.map((s) => [s.id, s.name])} /><//>
          <${Field} label="Parish" id="nb-parish"><${Select} id="nb-parish" value=${f.parish} onChange=${(v) => setF({ ...f, parish: v })} placeholder="Choose…" options=${PARISHES.map((p) => [p, p])} /><//>

        <div class="row"><button class="btn primary grow">Create my business</button><button type="button" class="btn ghost" onClick=${() => setCreating(false)}>Cancel</button></div>
        <p class="tiny muted">Starts a 14-day free trial of BuildFlow Basic. You can add services, contact details and photos later.</p>

    <div class="pills">${[["leadnew", "Add lead"], ["custnew", "Add customer"], ["projnew", "New project"], ["newpost", "Create post"]].map(([r, l]) => html`<button key=${r} class=${"btn sm " + (r === "newpost" ? "primary" : "outline")} style=${{ flex: "none" }} onClick=${() => go({ name: r })}><${Icon} n="plus" size=${16} />${l}</button>`)}</div>
    <div class="stats four">
      <button class=${"stat" + (newLeads ? " hot" : "")} onClick=${() => go({ name: "leads", status: "new" })}><${Icon} n="clipboard" /><b>${newLeads}</b><span class="small muted">New leads</span></button>
      <button class="stat" onClick=${() => go({ name: "projects" })}><${Icon} n="briefcase" /><b>${active}</b><span class="small muted">Active projects</span></button>
      <button class="stat" onClick=${() => go({ name: "projects", status: "completed" })}><${Icon} n="check" /><b>${done}</b><span class="small muted">Completed</span></button>
      <button class="stat" onClick=${() => go({ name: "customers" })}><${Icon} n="users" /><b>${customers.length}</b><span class="small muted">Customers</span></button>
    </div>
    <div class="band">
      <div><span class="small" style=${{ color: "#a9a498" }}>Open pipeline value</span><div class="big">${compact(pipeline)}</div><span class="tiny" style=${{ color: "#a9a498" }}>${open.length} open lead${open.length === 1 ? "" : "s"}</span></div>
      <div class="trio"><div><b>${views}</b><span>Profile views</span></div><div><b>${quotes}</b><span>Quote requests</span></div><div><b>${engagement}</b><span>Engagement</span></div></div>
      <p class="tiny" style=${{ color: "#a9a498" }}>Your profile generated ${quotes} quote request${quotes === 1 ? "" : "s"} this month.</p>
    </div>
    <div class="card"><div class="card-h"><h3>Tasks due</h3></div>${due.length ? html`<div class="list">${due.map((t) => html`<button key=${t.id} class="item" onClick=${() => go({ name: "project", id: t.project.id })}><span class="grow"><b class="truncate" style=${{ display: "block" }}>${t.title}</b><span class="tiny muted">${t.project.name}</span></span><span class="stack" style=${{ gap: 2, justifyItems: "end" }}><span class=${"tiny " + (t.due < today() ? "" : "muted")} style=${t.due < today() ? { color: "var(--red)", fontWeight: 700 } : null}>${t.due < today() ? "Overdue · " : ""}${day(t.due)}</span><${Badge} list=${PRIORITY} v=${t.priority} /></span></button>`)}</div>` : html`<p class="small muted" style=${{ padding: 16 }}>No upcoming tasks.</p>`}</div>
    <div class="card"><div class="card-h"><h3>Recent activity</h3></div>${activity.length ? html`<div class="list">${activity.slice(0, 8).map((a) => html`<button key=${a.id} class="item small" onClick=${() => a.ref && go(a.ref)}><span class="grow">${a.text}</span><span class="tiny muted">${ago(a.at)}</span></button>`)}</div>` : html`<p class="small muted" style=${{ padding: 16 }}>Leads, projects and updates will show up here.</p>`}</div>
  </div>`;

function NewPost({ projectId }) {
  const { act, go, biz, projects, assets } = useApp();
  const proj = projects.find((x) => x.id === projectId);
  const [f, setF] = useState({ type: proj ? (proj.status === "completed" ? "completed_project" : "work_in_progress") : "completed_project", caption: "", service: biz.primary || "", location: proj ? proj.location || "" : [biz.city, biz.parish].filter(Boolean).join(", "), projectId: projectId || "" });
  const [scenes, setScenes] = useState(["house", "house"]);
  const [files, setFiles] = useState([null, null]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const ba = f.type === "before_after";
  const slots = ba ? [0, 1] : [0];
  async function publish(e) {
    e.preventDefault(); setBusy(true); setErr("");
    const media = [];
    for (const i of slots) {
      if (files[i] && assets) {
        try { const r = await assets.upload(files[i]); media.push({ asset: r.id }); }
        catch (x) { setBusy(false); return setErr(x && x.code === "too_large" ? "That photo is too big (20 MB max)." : x && x.code === "unsupported_type" ? "Use a JPG, PNG or WEBP photo." : "Photo upload failed. Try again or use an illustration."); }
      } else media.push({ scene: scenes[i] });
    }
    const id = await act.createPost({ ...f, media });
    setBusy(false);
    if (id) go({ name: "post", id }); else setErr("Couldn't publish.");
  }
  return html`<form class="stack" onSubmit=${publish}>
    <${Back} to=${{ name: "dash" }}>Dashboard<//>
    <div><h1 class="h1">Showcase your work</h1><p class="small muted">Posts appear on your public profile and in Explore.</p></div>
    ${err && html`<div class="notice" role="alert">${err}</div>`}
    <div class="pills" role="radiogroup" aria-label="Post type">${POST_TYPES.map(([v, l]) => html`<button type="button" key=${v} class="pill" aria-pressed=${f.type === v} onClick=${() => setF({ ...f, type: v })}>${l}</button>`)}</div>
    <div class=${"grid2"}>${slots.map((i) => html`<div key=${i} class="card" style=${{ overflow: "hidden" }}>
      <div class="media" style=${{ position: "relative" }}>${files[i] ? html`<img src=${URL.createObjectURL(files[i])} alt="Selected photo" />` : html`<${Scene} kind=${scenes[i]} />`}${ba && html`<span class="lbl">${i ? "After" : "Before"}</span>`}</div>
      <div class="stack" style=${{ padding: 10, gap: 8 }}>
        ${assets ? html`<label class="btn outline sm" style=${{ cursor: "pointer" }}><${Icon} n="camera" size=${16} />${files[i] ? "Change photo" : "Upload a photo"}<input type="file" accept="image/jpeg,image/png,image/webp" style=${{ display: "none" }} onChange=${(e) => { const fl = e.target.files[0]; if (fl) { const n = [...files]; n[i] = fl; setFiles(n); } }} /></label>`
          : html`<p class="tiny muted">Photo uploads are available to people who can edit this demo. Pick an illustration instead:</p>`}
        ${!files[i] && html`<${Select} id=${"scene" + i} value=${scenes[i]} onChange=${(v) => { const n = [...scenes]; n[i] = v; setScenes(n); }} options=${SCENES} />`}
      </div></div>`)}</div>
    <div class="card pad stack">
      <${Field} label="Caption" id="np-c" opt><textarea id="np-c" class="input" maxlength="2200" value=${f.caption} onInput=${(e) => setF({ ...f, caption: e.target.value })} placeholder="What was the job? Materials, timeline, what the client wanted…"></textarea><//>
      <div class="grid2"><${Field} label="Service" id="np-s" opt><${Select} id="np-s" value=${f.service} onChange=${(v) => setF({ ...f, service: v })} placeholder="—" options=${SERVICES.map((s) => [s.id, s.name])} /><//><${Field} label="Location" id="np-l" opt><input id="np-l" class="input" value=${f.location} onInput=${(e) => setF({ ...f, location: e.target.value })} /><//></div>
      ${projects.length > 0 && html`<${Field} label="Link to project" id="np-p" opt><${Select} id="np-p" value=${f.projectId} onChange=${(v) => setF({ ...f, projectId: v })} placeholder="None" options=${projects.map((x) => [x.id, x.name])} /><//>`}
    </div>
    <button class="btn primary lg block" disabled=${busy}>${busy ? "Publishing…" : "Publish post"}</button>
  </form>`;
}

function EditProfile() {
  const { biz, act, go, toast } = useApp();
  const [f, setF] = useState({ name: biz.name, tagline: biz.tagline || "", description: biz.description || "", phone: biz.phone || "", email: biz.email || "", city: biz.city || "", parish: biz.parish || "", area: biz.area || "", years: biz.years ?? "", primary: biz.primary || "", services: biz.services || [] });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  async function save(e) { e.preventDefault(); const services = Array.from(new Set([f.primary, ...f.services].filter(Boolean))); if (await act.updateBusiness({ ...f, services, years: f.years === "" ? null : Number(f.years) })) { toast("Profile saved"); go({ name: "biz", id: biz.id }); } }
  return html`<form class="stack" onSubmit=${save}>
    <${Back} to=${{ name: "dash" }}>Dashboard<//>
    <h1 class="h1">Business profile</h1>
    <div class="card pad stack">
      <${Field} label="Business name" id="e-n"><input id="e-n" class="input" value=${f.name} onInput=${set("name")} /><//>
      <${Field} label="Tagline" id="e-t" opt><input id="e-t" class="input" maxlength="140" value=${f.tagline} onInput=${set("tagline")} /><//>
      <${Field} label="About" id="e-d" opt><textarea id="e-d" class="input" value=${f.description} onInput=${set("description")}></textarea><//>
      <div class="grid2"><${Field} label="Phone" id="e-p" opt><input id="e-p" class="input" value=${f.phone} onInput=${set("phone")} /><//><${Field} label="Email" id="e-e" opt><input id="e-e" class="input" value=${f.email} onInput=${set("email")} /><//></div>
      <div class="grid2"><${Field} label="Parish" id="e-pa"><${Select} id="e-pa" value=${f.parish} onChange=${(v) => setF({ ...f, parish: v })} options=${PARISHES.map((x) => [x, x])} /><//><${Field} label="City / area" id="e-c" opt><input id="e-c" class="input" value=${f.city} onInput=${set("city")} /><//></div>
      <div class="grid2"><${Field} label="Areas served" id="e-a" opt><input id="e-a" class="input" value=${f.area} onInput=${set("area")} /><//><${Field} label="Years in business" id="e-y" opt><input id="e-y" class="input" type="number" min="0" max="200" value=${f.years} onInput=${set("years")} /><//></div>
      <${Field} label="Main trade" id="e-pr"><${Select} id="e-pr" value=${f.primary} onChange=${(v) => setF({ ...f, primary: v })} options=${SERVICES.map((s) => [s.id, s.name])} /><//>
      <fieldset style=${{ border: 0, padding: 0, margin: 0 }}><legend class="small" style=${{ fontWeight: 650, marginBottom: 6 }}>All services you offer</legend><div class="row wrap">${SERVICES.map((s) => { const on = f.services.includes(s.id); return html`<button type="button" key=${s.id} class="pill" aria-pressed=${on} onClick=${() => setF({ ...f, services: on ? f.services.filter((x) => x !== s.id) : [...f.services, s.id] })}>${s.name}</button>`; })}</div></fieldset>
    </div>
    <button class="btn primary lg block">Save profile</button>
  </form>`;
}

/* ───────────────────────── App shell ───────────────────────── */
function App() {
  const [db, setDb] = useState(null);
  const [assets, setAssets] = useState(null);
  const [user, setUser] = useState(null);
  const [me, setMe] = useState(null);
  const [meName, setMeName] = useState("");
  const [status, setStatus] = useState("loading"); // loading | ready | nodb
  const [readOnly, setReadOnly] = useState(false);
  const [mode, setModeRaw] = useState(() => { try { return localStorage.getItem("bf-mode") || "customer"; } catch { return "customer"; } });
  const [actingAs, setActingAsRaw] = useState(() => { try { return localStorage.getItem("bf-biz") || ""; } catch { return ""; } });
  const [route, setRoute] = useState({ name: "home" });
  const [toastMsg, setToastMsg] = useState("");
  const [profiles, setProfiles] = useState({});

  useEffect(() => {
    let alive = true;
    (async () => {
      const [d, u, a] = await Promise.all([window.claude?.use("db"), window.claude?.use("user"), window.claude?.use("assets")].map((p) => Promise.resolve(p).catch(() => null)));
      if (!alive) return;
      setDb(d || null); setUser(u || null); setAssets(a || null);
      if (u) { const m = await u.me(); setMe(m.id); setMeName(m.name || ""); const w = await u.can("data.write"); if (w === false) setReadOnly(true); }
      setStatus(d ? "ready" : "nodb");
    })();
    const t = setTimeout(() => setStatus((s) => (s === "loading" ? "nodb" : s)), 11000);
    return () => { alive = false; clearTimeout(t); };
  }, []);

  const businesses = useQuery(db, (d) => d.collection("businesses"), []) || [];
  const posts = (useQuery(db, (d) => d.collection("posts").orderBy("createdAt", "desc").limit(300), []) || []);
  const savedDoc = useDoc(db, me ? `data/users/${me}/saved` : null);
  const saved = (savedDoc && savedDoc.postIds) || [];
  const biz = businesses.find((b) => b.id === actingAs);
  const scoped = (col) => (d) => (biz ? d.collection(col).where("businessId", "==", biz.id) : null);
  const leads = useQuery(db, scoped("leads"), [biz && biz.id]) || [];
  const customers = useQuery(db, scoped("customers"), [biz && biz.id]) || [];
  const projects = useQuery(db, scoped("projects"), [biz && biz.id]) || [];
  const activityRaw = useQuery(db, scoped("activity"), [biz && biz.id]) || [];
  const events = useQuery(db, scoped("events"), [biz && biz.id]) || [];
  const activity = useMemo(() => [...activityRaw].sort((a, b) => b.at - a.at), [activityRaw]);

  // Resolve names for people referenced in comments and notes (ids only are stored).
  const peopleIds = useMemo(() => Array.from(new Set([me, ...leads.flatMap((l) => (l.notes || []).map((n) => n.by)), ...customers.flatMap((c) => (c.notes || []).map((n) => n.by)), ...projects.flatMap((p) => (p.notes || []).map((n) => n.by))].filter(Boolean))), [me, leads, customers, projects]);
  const [commentAuthors, setCommentAuthors] = useState([]);
  useEffect(() => { if (user && peopleIds.length + commentAuthors.length) user.profiles([...peopleIds, ...commentAuthors]).then((p) => setProfiles((old) => ({ ...old, ...p }))); }, [user, peopleIds.join(","), commentAuthors.join(",")]);

  const toast = useCallback((m) => { setToastMsg(m); clearTimeout(window.__bfT); window.__bfT = setTimeout(() => setToastMsg(""), 2600); }, []);
  const setMode = (m) => { setModeRaw(m); try { localStorage.setItem("bf-mode", m); } catch {} setRoute({ name: m === "contractor" ? "dash" : "home" }); window.scrollTo(0, 0); };
  const setActingAs = (id) => { setActingAsRaw(id); try { localStorage.setItem("bf-biz", id); } catch {} };
  const go = (r) => { setRoute(r); window.scrollTo(0, 0); };

  // All writes go through here: one place for errors and the read-only state.
  async function w(fn, okMsg) {
    if (!db) return false;
    try { const r = await fn(); if (okMsg) toast(okMsg); return r === undefined ? true : r; }
    catch (e) {
      if (e && e.code === "invalid_argument") { setReadOnly(true); toast("You have view-only access to this demo"); }
      else if (e && e.code === "quota_exceeded") toast("The demo database is full");
      else toast("Something went wrong. Try again.");
      return false;
    }
  }
  const log = (text, ref) => biz && db.collection("activity").add({ businessId: biz.id, text, ref: ref || null, at: Date.now() });
  const notifyMissingBiz = () => { toast("Pick a business first"); return false; };

  const act = {
    toggleLike: (p) => !me ? toast("Sign in to like posts") : w(() => db.doc("posts/" + p.id).update({ likedBy: (p.likedBy || []).includes(me) ? p.likedBy.filter((x) => x !== me) : [...(p.likedBy || []), me] })),
    toggleSave: (id) => me ? w(() => db.doc(`data/users/${me}/saved`).set({ postIds: saved.includes(id) ? saved.filter((x) => x !== id) : [...saved, id] }), saved.includes(id) ? "Removed from saved" : "Saved") : toast("Sign in to save"),
    toggleFollow: (b) => !me ? toast("Sign in to follow") : w(() => db.doc("businesses/" + b.id).update({ followers: (b.followers || []).includes(me) ? b.followers.filter((x) => x !== me) : [...(b.followers || []), me] })),
    trackView: (bid, pid) => { if (!db || !me || (mode === "contractor" && actingAs === bid)) return; const id = `${bid}__${pid || "profile"}__${me}__${today()}`.replace(/[^A-Za-z0-9_\-.~:@+]/g, "-"); db.doc("events/" + id).set({ businessId: bid, type: pid ? "post_view" : "profile_view", postId: pid || null, at: Date.now() }).catch(() => {}); },
    addComment: (p, body) => !me ? toast("Sign in to comment") : w(async () => { await db.collection("comments").add({ postId: p.id, authorId: me, body, createdAt: Date.now() }); await db.doc("posts/" + p.id).update({ commentCount: (p.commentCount || 0) + 1 }); }),
    deleteComment: (p, c) => w(async () => { await db.doc("comments/" + c.id).delete(); await db.doc("posts/" + p.id).update({ commentCount: Math.max(0, (p.commentCount || 1) - 1) }); }),
    submitQuote: (b, f) => w(async () => {
      const description = [f.description.trim(), f.budget && "Budget: " + f.budget, f.timeline && "Timeline: " + f.timeline].filter(Boolean).join("\n");
      const ref = await db.collection("leads").add({ businessId: b.id, name: f.name.trim(), phone: f.phone.trim(), email: f.email.trim(), service: f.service || null, location: f.location.trim(), description, status: "new", source: "buildflow", value: null, kind: f.kind, requesterId: me, notes: [], customerId: null, createdAt: Date.now() });
      await db.collection("activity").add({ businessId: b.id, text: (f.kind === "quote" ? "Quote request from " : "Message from ") + f.name.trim(), ref: { name: "lead", id: ref.id }, at: Date.now() });
    }),
    createBusiness: (f) => w(async () => {
      const id = slugify(f.name) + "-" + uid().slice(0, 4);
      await db.doc("businesses/" + id).set({ name: f.name.trim(), slug: slugify(f.name), primary: f.primary, services: [f.primary], parish: f.parish, city: f.city.trim(), tagline: f.tagline.trim(), description: "", area: "", years: null, verified: false, demo: false, ownerId: me, followers: [], completed: 0, coverScene: "house", createdAt: Date.now() });
      return id;
    }),
    updateBusiness: (f) => !biz ? notifyMissingBiz() : w(() => db.doc("businesses/" + biz.id).update({ ...f, slug: slugify(f.name) })),
    saveLead: (f, lead) => !biz ? notifyMissingBiz() : w(async () => {
      const body = { name: f.name.trim(), phone: f.phone || "", email: f.email || "", description: f.description || "", location: f.location || "", service: f.service || null, value: f.value === "" ? null : Number(f.value), source: f.source };
      if (lead) { await db.doc("leads/" + lead.id).update(body); return lead.id; }
      const ref = await db.collection("leads").add({ ...body, businessId: biz.id, status: "new", notes: [], customerId: null, createdAt: Date.now() });
      await log("Added lead " + body.name, { name: "lead", id: ref.id }); return ref.id;
    }),
    leadStatus: (l, s) => w(async () => { await db.doc("leads/" + l.id).update({ status: s }); await log(`Moved ${l.name} to ${label(LEAD_ST, s)[1]}`, { name: "lead", id: l.id }); }),
    convertLead: (l) => w(async () => {
      const ref = await db.collection("customers").add({ businessId: biz.id, name: l.name, phone: l.phone || "", email: l.email || "", address: l.location || "", city: "", notesText: l.description || "", notes: [], createdAt: Date.now() });
      await db.doc("leads/" + l.id).update({ customerId: ref.id, status: ["won", "lost"].includes(l.status) ? l.status : "won" });
      await log("Converted lead " + l.name + " into a customer", { name: "customer", id: ref.id }); return ref.id;
    }),
    saveCustomer: (f, c) => !biz ? notifyMissingBiz() : w(async () => {
      const body = { name: f.name.trim(), phone: f.phone || "", email: f.email || "", address: f.address || "", city: f.city || "", notesText: f.notesText || "" };
      if (c) { await db.doc("customers/" + c.id).update(body); return c.id; }
      const ref = await db.collection("customers").add({ ...body, businessId: biz.id, notes: [], createdAt: Date.now() });
      await log("Added customer " + body.name, { name: "customer", id: ref.id }); return ref.id;
    }),
    saveProject: (f, p) => !biz ? notifyMissingBiz() : w(async () => {
      const body = { name: f.name.trim(), customerId: f.customerId || null, description: f.description || "", location: f.location || "", start: f.start || "", end: f.end || "", status: f.status, budget: f.budget === "" ? null : Number(f.budget) };
      if (p) { await db.doc("projects/" + p.id).update(body); await syncCompleted(); return p.id; }
      const ref = await db.collection("projects").add({ ...body, businessId: biz.id, leadId: f.leadId || null, tasks: [], notes: [], createdAt: Date.now() });
      if (f.leadId) { const l = leads.find((x) => x.id === f.leadId); if (l && l.status !== "won") await db.doc("leads/" + l.id).update({ status: "won" }); }
      await log("Created project " + body.name, { name: "project", id: ref.id }); if (body.status === "completed") await syncCompleted(); return ref.id;
    }),
    projectStatus: (p, s) => w(async () => { await db.doc("projects/" + p.id).update({ status: s }); await log(`${p.name} is now ${label(PROJ_ST, s)[1]}`, { name: "project", id: p.id }); await syncCompleted(p.id, s); }),
    addTask: (p, t) => w(async () => { await db.doc("projects/" + p.id).update({ tasks: [...(p.tasks || []), { id: uid(), title: t.title.trim(), due: t.due || "", priority: t.priority, status: "todo" }] }); }),
    taskStatus: (p, task, s) => w(async () => { await db.doc("projects/" + p.id).update({ tasks: (p.tasks || []).map((x) => (x.id === task.id ? { ...x, status: s } : x)) }); if (s === "done") await log(`Completed "${task.title}"`, { name: "project", id: p.id }); }),
    deleteTask: (p, task) => w(() => db.doc("projects/" + p.id).update({ tasks: (p.tasks || []).filter((x) => x.id !== task.id) })),
    addNote: (col, rec, body) => w(async () => { await db.doc(col + "/" + rec.id).update({ notes: [...(rec.notes || []), { body, by: me, at: Date.now() }] }); }, "Note added"),
    remove: (col, rec) => w(async () => { await db.doc(col + "/" + rec.id).delete(); if (col === "projects") await syncCompleted(); }, "Deleted"),
    createPost: (f) => !biz ? notifyMissingBiz() : w(async () => {
      const ref = await db.collection("posts").add({ businessId: biz.id, authorId: me, type: f.type, caption: f.caption.trim(), service: f.service || null, location: f.location || "", projectId: f.projectId || null, media: f.media, likedBy: [], commentCount: 0, createdAt: Date.now() });
      await log("Published a new post", { name: "post", id: ref.id }); return ref.id;
    }),
  };
  // completed-jobs figure on the public profile, recomputed from the projects themselves (no counters).
  async function syncCompleted(changedId, newStatus) {
    if (!biz) return;
    const n = projects.filter((p) => (p.id === changedId ? newStatus : p.status) === "completed").length;
    if (n !== biz.completed) await db.doc("businesses/" + biz.id).update({ completed: n });
  }

  const app = { db, assets: readOnly ? null : assets, me, meName, mode, setMode, actingAs, setActingAs, biz, businesses, posts, saved, leads, customers, projects, events, activity, go, act, toast, profiles, setCommentAuthors, readOnly };

  // Comment authors for the open post (so names resolve).
  const commentsForRoute = useQuery(db, (d) => (route.name === "post" ? d.collection("comments").where("postId", "==", route.id) : null), [route.name, route.id]);
  useEffect(() => { if (commentsForRoute) setCommentAuthors(Array.from(new Set(commentsForRoute.map((c) => c.authorId)))); }, [commentsForRoute]);

  let screen;
  if (status === "loading") screen = html`<div class="stack"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`;
  else if (status === "nodb") screen = html`<${Empty} icon="store" title="Open BuildFlow in Claude to use it" text="This demo keeps its data in a shared database that needs you to be signed in to Claude. Open the artifact link while signed in, or ask the owner to share it with you." />`;
  else if (status === "ready" && businesses.length === 0) screen = html`<${Empty} icon="store" title="Setting up the demo" text="No contractors yet. Switch to Contractor mode to create the first business." />`;
  else {
    const r = route;
    if (mode === "contractor" && !biz && !["biz", "post"].includes(r.name)) screen = html`<${PickBusiness} />`;
    else ({
      home: () => (screen = html`<${Home} />`),
      explore: () => (screen = html`<${Explore} />`),
      search: () => (screen = html`<${Explore} focus=${true} />`),
      saved: () => (screen = html`<${Saved} />`),
      biz: () => (screen = html`<${BizProfile} key=${r.id} id=${r.id} quote=${r.quote} />`),
      post: () => (screen = html`<${PostDetail} key=${r.id} id=${r.id} />`),
      pick: () => (screen = html`<${PickBusiness} />`),
      dash: () => (screen = html`<${Dashboard} welcome=${r.welcome} />`),
      leads: () => (screen = html`<${Leads} key=${r.status || "x"} status=${r.status} />`),
      lead: () => (screen = html`<${LeadDetail} id=${r.id} />`),
      leadnew: () => (screen = html`<${LeadForm} />`),
      leadedit: () => (screen = html`<${LeadForm} lead=${leads.find((l) => l.id === r.id)} />`),
      customers: () => (screen = html`<${Customers} />`),
      customer: () => (screen = html`<${CustomerDetail} id=${r.id} converted=${r.converted} />`),
      custnew: () => (screen = html`<${CustomerForm} />`),
      custedit: () => (screen = html`<${CustomerForm} c=${customers.find((c) => c.id === r.id)} />`),
      projects: () => (screen = html`<${Projects} key=${r.status || "x"} status=${r.status} />`),
      project: () => (screen = html`<${ProjectDetail} id=${r.id} />`),
      projnew: () => (screen = html`<${ProjectForm} leadId=${r.leadId} customerId=${r.customerId} />`),
      projedit: () => (screen = html`<${ProjectForm} p=${projects.find((p) => p.id === r.id)} />`),
      newpost: () => (screen = html`<${NewPost} projectId=${r.projectId} />`),
      editprofile: () => (screen = html`<${EditProfile} />`),
    }[r.name] || (() => (screen = html`<${Home} />`)))();
  }

  const custTabs = [["home", "Home", "home"], ["explore", "Explore", "compass"], ["search", "Search", "search"], ["saved", "Saved", "bookmark"]];
  const proTabs = [["dash", "Home", "home"], ["leads", "Leads", "clipboard"], ["projects", "Projects", "briefcase"], ["customers", "Customers", "users"], ["mybiz", "Profile", "store"]];
  const tabs = mode === "contractor" ? proTabs : custTabs;
  const activeTab = { lead: "leads", leadnew: "leads", leadedit: "leads", project: "projects", projnew: "projects", projedit: "projects", customer: "customers", custnew: "customers", custedit: "customers", post: mode === "customer" ? "explore" : "mybiz", biz: mode === "customer" ? "explore" : "mybiz", newpost: "dash", editprofile: "mybiz", pick: "dash" }[route.name] || route.name;

  return html`<${Ctx.Provider} value=${app}>
    <header class="top"><div class="col">
      <button class="logo" onClick=${() => go({ name: mode === "contractor" ? "dash" : "home" })} aria-label="BuildFlow home"><${LogoMark} /><span>BUILD<b>Flow</b></span></button>
      <div class="mode" role="group" aria-label="View as"><button aria-pressed=${mode === "customer"} onClick=${() => setMode("customer")}>Customer</button><button aria-pressed=${mode === "contractor"} onClick=${() => setMode("contractor")}>Contractor</button></div>
    </div>
    ${mode === "contractor" && biz && html`<div class="col row small" style=${{ minHeight: 38, borderTop: "1px solid var(--line)" }}><span class="muted">Working as</span><b class="grow truncate">${biz.name}</b><button class="btn ghost sm" onClick=${() => { setActingAs(""); go({ name: "pick" }); }}>Switch</button></div>`}
    </header>
    <main class="screen col">
      ${readOnly && html`<div class="notice" style=${{ marginBottom: 14 }}>You have view-only access, so changes won't save. Ask the owner for Contributor access to try everything.</div>`}
      ${screen}
    </main>
    <nav class="tabs" aria-label="Main"><div class="inner">${tabs.map(([r, l, ic]) => html`<button key=${r} aria-current=${activeTab === r ? "page" : undefined} onClick=${() => (r === "mybiz" ? (biz ? go({ name: "biz", id: biz.id }) : go({ name: "pick" })) : go({ name: r }))}><${Icon} n=${ic} />${l}</button>`)}</div></nav>
    ${toastMsg && html`<div class="toast" role="status">${toastMsg}</div>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
